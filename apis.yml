name: Fusion-io
description: >-
  Fusion-io was a computer hardware and software systems company founded in 2005
  in Salt Lake City, Utah, that pioneered PCIe-based flash memory (NAND) storage
  for enterprise data centers under the ioMemory, ioDrive, ioFX and ioScale product
  lines. Steve Wozniak served as its Chief Scientist. The company IPO'd on the NYSE
  under the ticker FIO in June 2011 and was acquired by SanDisk in 2014 for roughly
  1.1 billion dollars; SanDisk (and the Fusion-io technology) was in turn acquired by
  Western Digital in 2016. It was venture-backed by New Enterprise Associates,
  Lightspeed Venture Partners and Accel. Fusion-io no longer operates as an independent
  company and publishes no public developer API surface. This profile is retained in the
  API Evangelist network as a historical company record.
